<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Original schematic redrawn for LancerParts. Layout and callout codes follow the
